name: dji-sales-dashboard

services:
  db:
    image: postgres:17-alpine
    container_name: dji-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dji_sales}
      POSTGRES_USER: ${POSTGRES_USER:-dji}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dji}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dji} -d ${POSTGRES_DB:-dji_sales}"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dji-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=${POSTGRES_DB:-dji_sales};Username=${POSTGRES_USER:-dji};Password=${POSTGRES_PASSWORD:-dji}"
      Startup__ApplyMigrations: "true"
      Startup__RunSeed: "true"
      Seed__RandomSeed: "20260901"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-5080}:8080"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dji-web
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:80"

volumes:
  pgdata:
